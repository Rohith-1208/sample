<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Progress Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .widget {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .widget-title {
      font-size: 18px;
      font-weight: 700;
    }

    .widget-subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .progress-section {
      margin-bottom: 24px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--text-sub);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 33%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .task-item:hover {
      background: var(--surface-hover);
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .task-item.completed label {
      text-decoration: line-through;
      color: var(--text-sub);
    }

    .task-item label {
      font-size: 14px;
      cursor: pointer;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="widget">
    <div class="widget-header">
      <div>
        <h2 class="widget-title">Sprint Checklist</h2>
        <p class="widget-subtitle">Antigravity Deployment v2.0</p>
      </div>
      <span class="badge" id="status-badge">In Progress</span>
    </div>

    <div class="progress-section">
      <div class="progress-meta">
        <span>Completion</span>
        <span id="progress-percent">33%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <ul class="task-list">
      <li class="task-item completed">
        <input type="checkbox" id="t1" checked />
        <label for="t1">Design UI layout & tokens</label>
      </li>
      <li class="task-item">
        <input type="checkbox" id="t2" />
        <label for="t2">Integrate responsive interactions</label>
      </li>
      <li class="task-item">
        <input type="checkbox" id="t3" />
        <label for="t3">Run browser tests & deploy</label>
      </li>
    </ul>
  </div>

  <script>
    const checkboxes = document.querySelectorAll('.task-item input[type="checkbox"]');
    const fill = document.getElementById('progress-fill');
    const percentText = document.getElementById('progress-percent');
    const badge = document.getElementById('status-badge');

    function updateProgress() {
      const total = checkboxes.length;
      let completed = 0;

      checkboxes.forEach(cb => {
        const parent = cb.closest('.task-item');
        if (cb.checked) {
          completed++;
          parent.classList.add('completed');
        } else {
          parent.classList.remove('completed');
        }
      });

      const percentage = Math.round((completed / total) * 100);
      fill.style.width = percentage + '%';
      percentText.textContent = percentage + '%';

      if (percentage === 100) {
        badge.textContent = 'Completed 🎉';
        badge.style.background = 'rgba(16, 185, 129, 0.2)';
        badge.style.color = '#34d399';
      } else {
        badge.textContent = 'In Progress';
        badge.style.background = 'rgba(56, 189, 248, 0.15)';
        badge.style.color = '#38bdf8';
      }
    }

    checkboxes.forEach(cb => cb.addEventListener('change', updateProgress));
    updateProgress();
  </script>
</body>
</html>
