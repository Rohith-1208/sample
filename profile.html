<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Profile Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg) 75%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .status-badge {
      position: absolute;
      bottom: 2px;
      right: 4px;
      width: 16px;
      height: 16px;
      background: #10b981;
      border: 3px solid #0f172a;
      border-radius: 50%;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .handle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .bio {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 24px 0;
      padding: 16px 0;
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
    }

    .stat-item h3 {
      font-size: 18px;
      font-weight: 700;
    }

    .stat-item span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px var(--accent-glow);
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .btn-action:hover {
      opacity: 0.92;
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <div class="avatar">⚡</div>
      <div class="status-badge" title="Online"></div>
    </div>
    <h2>Alex Rivera</h2>
    <div class="handle">@alexrivera.dev</div>
    <p class="bio">Full-Stack Engineer building modern web apps, high-performance UI systems, and creative tech.</p>

    <div class="stats">
      <div class="stat-item">
        <h3 id="followers-count">12.4k</h3>
        <span>Followers</span>
      </div>
      <div class="stat-item">
        <h3>84</h3>
        <span>Projects</span>
      </div>
      <div class="stat-item">
        <h3>99.9%</h3>
        <span>Uptime</span>
      </div>
    </div>

    <button class="btn-action" id="connect-btn">Connect With Me</button>
  </div>

  <script>
    const btn = document.getElementById('connect-btn');
    btn.addEventListener('click', () => {
      btn.innerText = 'Request Sent ✓';
      btn.style.background = '#10b981';
      btn.disabled = true;
    });
  </script>
</body>
</html>
